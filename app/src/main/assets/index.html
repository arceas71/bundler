<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>OFFGRID — Simple Offline Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0B0B0D;
      --card: #17171B;
      --border: #29292F;
      --primary: #C8FF57;
      --text: #F5F5F5;
      --muted: #92929D;
      --dim: #555560;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
      font-size: 14px;
    }

    .app-container {
      width: 100%;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Top Bar */
    header {
      padding: 14px 16px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background-color: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--dim);
    }
    .dot.connected { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); }

    /* Quick Action Buttons Bar */
    .quick-actions {
      padding: 10px 16px;
      display: flex;
      gap: 8px;
      background-color: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .action-btn {
      flex: 1;
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .action-btn.primary { background-color: var(--primary); color: #0B0B0D; border: none; }

    /* Message Area */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message-row {
      display: flex;
      flex-direction: column;
      max-width: 80%;
    }
    .message-row.incoming { align-self: flex-start; }
    .message-row.outgoing { align-self: flex-end; align-items: flex-end; }

    .bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.4;
      word-break: break-word;
    }
    .incoming .bubble { background-color: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
    .outgoing .bubble { background-color: var(--primary); color: #0B0B0D; font-weight: 500; border-bottom-right-radius: 2px; }

    .meta {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px;
      padding: 0 2px;
    }

    /* Composer */
    .composer {
      padding: 12px 16px;
      background-color: var(--bg);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: center;
    }

    input {
      flex: 1;
      background-color: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13.5px;
      outline: none;
    }
    input:focus { border-color: var(--muted); }

    .send-btn {
      background-color: var(--primary);
      color: #0B0B0D;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .send-btn:disabled { background-color: var(--card); color: var(--dim); cursor: not-allowed; }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand">OFFGRID</div>
      <div class="status-badge" onclick="toggleConnection()">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <div class="quick-actions">
      <button class="action-btn primary" onclick="hostServer()">Host Server</button>
      <button class="action-btn" onclick="scanPeers()">Find & Connect</button>
      <button class="action-btn" onclick="clearHistory()">Clear</button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <!-- Messages populate here -->
    </div>

    <div class="composer">
      <input type="text" id="msgInput" placeholder="Type a message..." oninput="checkInput(this)" onkeydown="if(event.key==='Enter')sendMessage()">
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
  </div>

  <script>
    let connected = false;
    let messages = JSON.parse(localStorage.getItem('simple_chat_history') || '[]');

    function render() {
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      
      if (messages.length === 0) {
        container.innerHTML = `<div style="margin: auto; color: var(--muted); font-size: 12px; text-align: center;">No messages. Tap Host or Find to begin.</div>`;
        return;
      }

      messages.forEach(m => {
        const row = document.createElement('div');
        row.className = `message-row ${m.mine ? 'outgoing' : 'incoming'}`;
        row.innerHTML = `
          <div class="bubble">${escapeHtml(m.text)}</div>
          <div class="meta">${new Date(m.time).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
        `;
        container.appendChild(row);
      });
      container.scrollTop = container.scrollHeight;
    }

    function checkInput(el) {
      document.getElementById('sendBtn').disabled = el.value.trim().length === 0;
    }

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const text = input.value.trim();
      if (!text) return;

      messages.push({ text, mine: true, time: Date.now() });
      localStorage.setItem('simple_chat_history', JSON.stringify(messages));
      input.value = '';
      document.getElementById('sendBtn').disabled = true;
      render();

      if (window.AndroidBluetooth) {
        try { window.AndroidBluetooth.sendMessage(text); } catch(e) {}
      } else if (connected) {
        setTimeout(() => {
          messages.push({ text: `Echo: ${text}`, mine: false, time: Date.now() });
          localStorage.setItem('simple_chat_history', JSON.stringify(messages));
          render();
        }, 800);
      }
    }

    function hostServer() {
      if (window.AndroidBluetooth) {
        AndroidBluetooth.startServer('OffgridChat');
      } else {
        setConnectedState(true, 'Hosting (Simulator)');
      }
    }

    function scanPeers() {
      if (window.AndroidBluetooth) {
        AndroidBluetooth.discoverAndConnect();
      } else {
        setConnectedState(true, 'Peer-Node');
      }
    }

    function toggleConnection() {
      setConnectedState(!connected, connected ? 'Disconnected' : 'Peer-Node');
    }

    function setConnectedState(state, peerName) {
      connected = state;
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (connected) {
        dot.classList.add('connected');
        text.textContent = peerName;
      } else {
        dot.classList.remove('connected');
        text.textContent = 'Disconnected';
      }
    }

    function clearHistory() {
      messages = [];
      localStorage.removeItem('simple_chat_history');
      render();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
    }

    // Hook for Android Native bridge
    window.onNativeBtEvent = function(payload) {
      let ev = typeof payload === 'string' ? JSON.parse(payload) : payload;
      if (ev.event === 'STATE_CHANGED' && ev.state === 'CONNECTED') {
        setConnectedState(true, ev.peerName || 'Connected');
      } else if (ev.event === 'MESSAGE_RECEIVED') {
        messages.push({ text: ev.raw, mine: false, time: Date.now() });
        localStorage.setItem('simple_chat_history', JSON.stringify(messages));
        render();
      }
    };

    render();
  </script>
</body>
</html>
