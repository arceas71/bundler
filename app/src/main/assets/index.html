<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Offline Chat</title>
<style>
:root{color-scheme:dark;--bg:#0d0d12;--panel:#171720;--accent:#a78bfa;--text:#f4f3fa;--muted:#aaa8bb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,sans-serif;min-height:100dvh;display:flex;justify-content:center}
.app{width:100%;max-width:620px;display:flex;flex-direction:column;height:100dvh;padding:14px;gap:12px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 2px}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.status{font-size:12px;padding:7px 10px;border:1px solid #353546;border-radius:999px;color:var(--muted)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{border:0;border-radius:12px;padding:12px;background:var(--accent);color:#171222;font-weight:700;font-size:14px}
button.secondary{background:#292938;color:var(--text)}button.danger{background:#482b38;color:#ffd9e3}
.note{background:#191923;border:1px solid #2c2c3b;padding:10px 12px;border-radius:12px;font-size:12px;color:var(--muted);line-height:1.45}
#messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:9px;padding:4px 0}
.bubble{max-width:84%;padding:10px 12px;border-radius:15px;background:#252535;overflow-wrap:anywhere;white-space:pre-wrap}
.bubble.mine{align-self:flex-end;background:#5b45a1}.bubble.theirs{align-self:flex-start}
.time{font-size:10px;opacity:.65;margin-top:5px}
.composer{display:flex;gap:8px;padding-bottom:env(safe-area-inset-bottom)}
input{min-width:0;flex:1;border:1px solid #353546;background:var(--panel);color:var(--text);border-radius:12px;padding:12px;font:inherit}
#send{min-width:76px}
</style>
</head>
<body><main class="app">
<header><div><h1>Offline Chat</h1><div class="sub">Direct Bluetooth · No internet</div></div><div class="status" id="status">Not connected</div></header>
<div class="controls">
<button onclick="host()">Host chat</button>
<button class="secondary" onclick="join()">Find &amp; connect</button>
<button class="secondary" onclick="pairing()">Bluetooth settings</button>
<button class="danger" onclick="disconnect()">Disconnect</button>
</div>
<div class="note">Pair both phones in Android Bluetooth settings first. On one phone tap Host chat; on the other tap Find &amp; connect and select the host. Keep this app open while chatting.</div>
<section id="messages" aria-live="polite"></section>
<form class="composer" onsubmit="send(event)"><input id="text" placeholder="Write a message…" autocomplete="off"><button id="send">Send</button></form>
</main>
<script>
const $=id=>document.getElementById(id);
let connected=false;
function stamp(){return new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});}
function bubble(text,mine){const d=document.createElement('div');d.className='bubble '+(mine?'mine':'theirs');const body=document.createElement('div');body.textContent=text;const time=document.createElement('div');time.className='time';time.textContent=stamp();d.append(body,time);$('messages').append(d);$('messages').scrollTop=$('messages').scrollHeight;const history=JSON.parse(localStorage.getItem('offlineChatHistory')||'[]');history.push({text,mine,at:Date.now()});localStorage.setItem('offlineChatHistory',JSON.stringify(history.slice(-300)));}
function renderHistory(){try{for(const m of JSON.parse(localStorage.getItem('offlineChatHistory')||'[]')){const d=document.createElement('div');d.className='bubble '+(m.mine?'mine':'theirs');const body=document.createElement('div');body.textContent=m.text;const time=document.createElement('div');time.className='time';time.textContent=new Date(m.at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.append(body,time);$('messages').append(d)}}catch(e){}}
function host(){if(window.AndroidBluetooth)AndroidBluetooth.startServer('OfflineChat');else alert('Native Bluetooth bridge is not available. Package this project as the provided Android app.');}
function join(){if(window.AndroidBluetooth)AndroidBluetooth.discoverAndConnect();else alert('Native Bluetooth bridge is not available.');}
function disconnect(){if(window.AndroidBluetooth)AndroidBluetooth.disconnect();}
function pairing(){if(window.AndroidBluetooth){alert('Open Android Settings → Bluetooth and pair both phones first.');}else alert('Open your device Bluetooth settings.');}
function send(e){e.preventDefault();const t=$('text').value.trim();if(!t)return;if(!connected){alert('Not connected. Connect to the other phone first.');return;}AndroidBluetooth.sendMessage(t);bubble(t,true);$('text').value='';}
window.addEventListener('nativeBluetoothEvent',e=>{const d=e.detail||{};if(d.type==='state'){$('status').textContent=d.state==='connected'?'Connected':d.state==='hosting'?'Waiting for peer…':d.state==='connecting'?'Connecting…':'Not connected';connected=d.state==='connected';if(d.message&&d.state==='connected')bubble('✓ '+d.message,false);}else if(d.type==='message'){bubble(d.message,false);}else if(d.type==='error'){alert(d.message||'Bluetooth error');}});
renderHistory();
</script></body></html>
